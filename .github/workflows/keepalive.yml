# Keeps the free Supabase project awake: it pauses after 7 days without activity.
name: Keep database awake
on:
  schedule:
    - cron: "23 5 */3 * *"   # every 3 days
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN3dnNtYW53c25ocGJodGhveW93Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ5OTUzMDcsImV4cCI6MjExMDU3MTMwN30.POmJFdb0A7SVQD4KzvQfxJ9nRIkDKSecXJtA3y0kHm0" \
            "https://swvsmanwsnhpbhthoyow.supabase.co/rest/v1/content?select=key&limit=1")
          echo "Supabase answered $code"
          test "$code" = "200"
